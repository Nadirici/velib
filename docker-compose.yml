# Infra locale : Kafka (KRaft) + Redis + Airflow, avec des UIs d'inspection.
#   docker compose up -d       démarrer
#   docker compose down        arrêter (volumes conservés)
#   docker compose down -v     tout supprimer

services:
  kafka:
    # Kafka 4 en mode KRaft (sans ZooKeeper), nœud unique broker + controller.
    image: apache/kafka:4.1.0
    container_name: velib-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Deux listeners : EXTERNAL (localhost:9092) pour l'hôte, INTERNAL
      # (kafka:19092) pour les autres conteneurs. L'adresse annoncée
      # (advertised) doit être joignable depuis le client qui s'y reconnecte.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Réplication 1 sur les topics internes (nœud unique).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Topic créé explicitement par ensure_topic (partitions, rétention).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    # Inspection des topics / partitions / lag : http://localhost:8080
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: velib-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: velib-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  redis:
    # Vue matérialisée de l'état courant des stations (persistance AOF).
    image: redis:7-alpine
    container_name: velib-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  redisinsight:
    # UI Redis : http://localhost:5540
    image: redis/redisinsight:latest
    container_name: velib-redisinsight
    depends_on:
      - redis
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data

  airflow:
    # Orchestrateur des jobs batch (mode standalone, SQLite) : http://localhost:8081
    image: apache/airflow:3.1.0
    container_name: velib-airflow
    depends_on:
      - kafka
    command: airflow standalone
    ports:
      - "8081:8080"
    environment:
      # Fuseau du conteneur : l'archiveur découpe les journées et calcule la
      # colonne `hour` en heure de Paris.
      TZ: Europe/Paris
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/velib/dags
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Paris
      # Auth locale sans login — usage local uniquement.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # Dépendances installées au démarrage (raccourci dev ; image custom en prod).
      _PIP_ADDITIONAL_REQUIREMENTS: "confluent-kafka duckdb httpx truststore"
      VELIB_BOOTSTRAP_SERVERS: kafka:19092
      PYTHONPATH: /opt/velib/src
    volumes:
      # Repo monté : code (PYTHONPATH) + data/ où atterrissent les Parquet.
      - .:/opt/velib
      - airflow-data:/opt/airflow

  # PostgreSQL (chargement analytique) — prochaine étape de la roadmap :
  # postgres:
  #   image: postgres:17-alpine
  #   ports: ["5432:5432"]
  #   environment:
  #     POSTGRES_USER: velib
  #     POSTGRES_PASSWORD: velib
  #     POSTGRES_DB: velib
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data

volumes:
  kafka-data:
  redis-data:
  redisinsight-data:
  airflow-data:
