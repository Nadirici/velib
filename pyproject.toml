[project]
name = "velib"
version = "0.1.0"
description = "Pipeline temps réel Vélib' : API open data -> Kafka -> dashboard"
requires-python = ">=3.13"
dependencies = [
    "httpx",
    "truststore",
    "confluent-kafka",
    "redis>=8.0.1",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "duckdb>=1.5.4",
    "google-cloud-storage>=3.13.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.36.2",
    "pytest",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# La couverture est mesurée à chaque `pytest` et le build échoue sous 90 %.
addopts = "--cov=velib --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
]
