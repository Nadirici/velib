[project]
name = "velib"
version = "0.1.0"
description = "Pipeline temps réel Vélib' : API open data -> Kafka -> dashboard"
requires-python = ">=3.13"
dependencies = [
    "httpx",
    "truststore",
    "confluent-kafka",
    "redis>=8.0.1",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
